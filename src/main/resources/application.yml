server:
  port: 8084

spring:
  application:
    name: consumer-schedules-buses-red
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: admin
    password: admin123
    virtual-host: /

rabbitmq:
  exchange:
    schedules: schedules.exchange
  queue:
    schedules: schedules.queue
  routing-key:
    schedules: schedules.routing.key

file:
  storage:
    path: /app/update_rutas

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.busesred: DEBUG
    org.springframework.amqp: DEBUG
